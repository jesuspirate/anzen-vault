[package]
name = "anzen"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Anzen renewable Bitcoin vault CLI"
autobins = false

[workspace]
members = [".", "cold-signer"]
exclude = ["ledger-app"]
default-members = ["."]
resolver = "3"

[[bin]]
name = "anzen"
path = "src/main.rs"

[features]
# USB support for a real Ledger. Needs libudev headers on Linux; the emulator works without it.
ledger-usb = ["dep:ledger-transport-hid", "dep:ledger-apdu"]
# USB support for a real BitBox02. Needs libudev headers on Linux; the simulator works without it.
bitbox-usb = ["bitbox-api/usb"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bdk_bitcoind_rpc = "0.22.0"
bdk_electrum = "0.23.2"
bdk_wallet = { version = "3.1.0", features = ["keys-bip39", "rusqlite"] }
bitcoin = { version = "0.32.9", features = ["base64", "rand-std", "serde"] }
bitbox-api = { version = "0.13.0", default-features = false, features = ["simulator", "tokio", "multithreaded"] }
bitcoincore-rpc = "0.19.0"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
hkdf = "0.12"
ledger_bitcoin_client = { version = "0.7.0", default-features = false, features = ["paranoid_client"] }
ledger-apdu = { version = "0.11.0", optional = true }
ledger-transport-hid = { version = "0.11.0", optional = true }
miniscript = { version = "12.3.5", features = ["serde"] }
pgp = { version = "=0.17.0", default-features = false }
rand = "0.8"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
bitcoinconsensus = "0.106.0"

[profile.release]
lto = "thin"
strip = true
