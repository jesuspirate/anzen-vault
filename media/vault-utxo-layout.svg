<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Anzen annual vault rollover layout</title>
  <desc id="desc">A confirmed 2.1 bitcoin vault is spent by the annual rollover. The rollover creates twelve 0.1 bitcoin allowance months with unlock dates about 30 days apart, the vault remainder and, with emergency access, the emergency connector. The remainder feeds the presigned second-year renewal and, with the connector, the presigned emergency transactions.</desc>
  <defs>
    <marker id="arrow-neutral" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 6 3 0 6z" fill="#737373"/></marker>
    <marker id="arrow-vault" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 6 3 0 6z" fill="#0ea5e9"/></marker>
    <marker id="arrow-month" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 6 3 0 6z" fill="#7c3aed"/></marker>
    <marker id="arrow-connector" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 6 3 0 6z" fill="#b7791f"/></marker>
  </defs>
  <style>
    :root { --bg:#fff; --panel:#fafafa; --fg:#171717; --dim:#737373; --rule:#d4d4d4; --vault:#0ea5e9; --month:#7c3aed; --connector:#b7791f; --execute:#16a34a; }
    @media (prefers-color-scheme:dark) { :root { --bg:#0a0a0a; --panel:#0a0a0a; --fg:#e5e5e5; --dim:#737373; --rule:#262626; --vault:#38bdf8; --month:#a78bfa; --connector:#c99a55; --execute:#42c470; } }
    text { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; text-anchor:start; }
    .title { fill:var(--fg); font-size:22px; font-weight:650; letter-spacing:.02em; }
    .subtitle { fill:var(--dim); font-size:12px; }
    .label { fill:var(--fg); font-size:14px; font-weight:650; text-anchor:middle; }
    .small { fill:var(--dim); font-size:10px; text-anchor:middle; }
    .tiny { fill:var(--dim); font-size:9px; text-anchor:middle; }
    .left { text-anchor:start; }
    .panel { fill:var(--panel); stroke:var(--rule); stroke-width:1.25; }
    .vault circle { fill:var(--bg); stroke:var(--vault); stroke-width:1.6; }
    .month circle { fill:var(--bg); stroke:var(--month); stroke-width:1.5; }
    .month text { fill:var(--month); font-weight:650; font-size:11px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; text-anchor:middle; }
    .connector circle { fill:var(--bg); stroke:var(--connector); stroke-width:1.5; }
    .connector text { fill:var(--connector); font-weight:650; font-size:11px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; text-anchor:middle; }
    .tx rect { fill:var(--bg); stroke:var(--dim); stroke-width:1.4; }
    .chain rect { fill:var(--bg); stroke:var(--execute); stroke-width:1.4; stroke-dasharray:5 4; }
    .neutral { fill:none; stroke:var(--dim); stroke-width:1.4; marker-end:url(#arrow-neutral); }
    .vault-line { fill:none; stroke:var(--vault); stroke-width:1.4; stroke-dasharray:5 4; marker-end:url(#arrow-vault); }
    .month-line { fill:none; stroke:var(--month); stroke-width:1.4; stroke-dasharray:5 4; marker-end:url(#arrow-month); }
    .connector-line { fill:none; stroke:var(--connector); stroke-width:1.4; stroke-dasharray:5 4; marker-end:url(#arrow-connector); }
  </style>

  <rect width="1000" height="500" fill="var(--bg)"/>
  <text class="title" x="35" y="43">ANNUAL ROLLOVER</text>
  <text class="subtitle" x="35" y="64">one confirmed transaction creates twelve dated months, the remainder and a connector</text>

  <g aria-label="Example policy">
    <rect class="panel" x="730" y="18" width="235" height="62" rx="13"/>
    <text class="small" x="747" y="39" style="text-anchor:start;font-weight:650;fill:var(--fg)">EXAMPLE POLICY</text>
    <text class="tiny" x="747" y="57" style="text-anchor:start">2.1 BTC · 0.1 BTC monthly · 0.5 BTC emergency</text>
  </g>

  <rect class="panel" x="25" y="100" width="950" height="330" rx="18"/>

  <g class="vault" aria-label="Confirmed source vault">
    <circle cx="115" cy="250" r="61"/>
    <text class="label" x="115" y="245">2.1 BTC VAULT</text>
    <text class="small" x="115" y="265">confirmed on-chain</text>
  </g>

  <path class="neutral" d="M176 250H205"/>
  <g class="tx" aria-label="Confirmed annual rollover transaction">
    <rect x="213" y="212" width="120" height="76" rx="14"/>
    <text class="label" x="273" y="243">ROLLOVER</text>
    <text class="small" x="273" y="261">HWW-signed</text>
    <text class="small" x="273" y="275">confirmed</text>
  </g>

  <path class="month-line" d="M333 236C362 236 350 202 372 202"/>
  <path class="vault-line" d="M333 264C390 264 385 362 422 362"/>
  <path class="connector-line" d="M290 288C305 306 330 306 370 306H725C750 306 760 318 764 334"/>

  <rect class="panel" x="380" y="114" width="430" height="176" rx="15"/>
  <text class="tiny left" x="398" y="134" style="font-weight:650;fill:var(--fg)">ALLOWANCE LADDER</text>
  <text class="tiny" x="792" y="134" style="text-anchor:end">12 × 0.1 BTC · outputs 0 to 11</text>
  <g class="month" aria-label="Allowance month 1">
    <circle cx="430" cy="175" r="21"/>
    <text x="430" y="179">M1</text>
  </g>
  <text class="tiny" x="430" y="208">day 30</text>
  <g class="month" aria-label="Allowance month 2">
    <circle cx="496" cy="175" r="21"/>
    <text x="496" y="179">M2</text>
  </g>
  <text class="tiny" x="496" y="208">day 60</text>
  <g class="month" aria-label="Allowance month 3">
    <circle cx="562" cy="175" r="21"/>
    <text x="562" y="179">M3</text>
  </g>
  <text class="tiny" x="562" y="208">day 90</text>
  <g class="month" aria-label="Allowance month 4">
    <circle cx="628" cy="175" r="21"/>
    <text x="628" y="179">M4</text>
  </g>
  <text class="tiny" x="628" y="208">day 120</text>
  <g class="month" aria-label="Allowance month 5">
    <circle cx="694" cy="175" r="21"/>
    <text x="694" y="179">M5</text>
  </g>
  <text class="tiny" x="694" y="208">day 150</text>
  <g class="month" aria-label="Allowance month 6">
    <circle cx="760" cy="175" r="21"/>
    <text x="760" y="179">M6</text>
  </g>
  <text class="tiny" x="760" y="208">day 180</text>
  <g class="month" aria-label="Allowance month 7">
    <circle cx="430" cy="242" r="21"/>
    <text x="430" y="246">M7</text>
  </g>
  <text class="tiny" x="430" y="275">day 210</text>
  <g class="month" aria-label="Allowance month 8">
    <circle cx="496" cy="242" r="21"/>
    <text x="496" y="246">M8</text>
  </g>
  <text class="tiny" x="496" y="275">day 240</text>
  <g class="month" aria-label="Allowance month 9">
    <circle cx="562" cy="242" r="21"/>
    <text x="562" y="246">M9</text>
  </g>
  <text class="tiny" x="562" y="275">day 270</text>
  <g class="month" aria-label="Allowance month 10">
    <circle cx="628" cy="242" r="21"/>
    <text x="628" y="246">M10</text>
  </g>
  <text class="tiny" x="628" y="275">day 300</text>
  <g class="month" aria-label="Allowance month 11">
    <circle cx="694" cy="242" r="21"/>
    <text x="694" y="246">M11</text>
  </g>
  <text class="tiny" x="694" y="275">day 330</text>
  <g class="month" aria-label="Allowance month 12">
    <circle cx="760" cy="242" r="21"/>
    <text x="760" y="246">M12</text>
  </g>
  <text class="tiny" x="760" y="275">day 360</text>

  <rect class="panel" x="826" y="114" width="134" height="176" rx="15"/>
  <text class="tiny left" x="842" y="138" style="font-weight:650;fill:var(--fg)">EACH MONTH</text>
  <text class="tiny left" x="842" y="160">its own address</text>
  <text class="tiny left" x="842" y="180">phone alone after</text>
  <text class="tiny left" x="842" y="194">its date (nLockTime)</text>
  <text class="tiny left" x="842" y="214">HWW alone at</text>
  <text class="tiny left" x="842" y="228">any time</text>
  <text class="tiny left" x="842" y="248">nothing presigned</text>
  <text class="tiny left" x="842" y="262">per month</text>

  <g class="vault" aria-label="Confirmed vault remainder">
    <circle cx="470" cy="362" r="40"/>
    <text class="label" x="470" y="359" style="font-size:13px">≈0.9 BTC</text>
    <text class="tiny" x="470" y="375">vault remainder</text>
  </g>
  <path class="vault-line" d="M510 362H532"/>
  <g class="chain" aria-label="Presigned second-year renewal">
    <rect x="540" y="330" width="160" height="64" rx="13"/>
    <text class="label" x="620" y="352" style="font-size:12px">YEAR 2 RENEWAL</text>
    <text class="small" x="620" y="369">presigned · after 360 days</text>
    <text class="tiny" x="620" y="383">next ladder + P2A anchor</text>
  </g>

  <g class="connector" aria-label="Confirmed emergency connector">
    <circle cx="770" cy="362" r="24"/>
    <text x="770" y="366">Cₑ</text>
    <text class="tiny" x="770" y="400">1k sats</text>
  </g>
  <path class="connector-line" d="M794 362H822"/>
  <path class="vault-line" d="M492 395C500 414 520 416 545 416H890V406"/>
  <g class="chain" aria-label="Presigned emergency transactions">
    <rect x="830" y="326" width="120" height="72" rx="13"/>
    <text class="label" x="890" y="353" style="font-size:12px">EMERGENCY</text>
    <text class="small" x="890" y="371">trigger and</text>
    <text class="small" x="890" y="385">withdrawal</text>
  </g>

  <g aria-label="Diagram key">
    <text class="tiny" x="55" y="461" style="text-anchor:start;font-weight:650;fill:var(--fg)">KEY</text>
    <circle cx="100" cy="458" r="12" fill="var(--bg)" stroke="var(--vault)" stroke-width="1.4"/>
    <text class="tiny" x="120" y="462" style="text-anchor:start">vault UTXO</text>
    <circle cx="205" cy="458" r="11" fill="var(--bg)" stroke="var(--month)" stroke-width="1.4"/>
    <text class="tiny" x="224" y="462" style="text-anchor:start">allowance month</text>
    <circle cx="330" cy="458" r="10" fill="var(--bg)" stroke="var(--connector)" stroke-width="1.4"/>
    <text class="tiny" x="348" y="462" style="text-anchor:start">connector UTXO</text>
    <rect x="440" y="447" width="38" height="22" rx="5" fill="var(--bg)" stroke="var(--dim)" stroke-width="1.3"/>
    <text class="tiny" x="486" y="462" style="text-anchor:start">transaction</text>
    <rect x="560" y="447" width="38" height="22" rx="5" fill="var(--bg)" stroke="var(--execute)" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text class="tiny" x="606" y="462" style="text-anchor:start">presigned, not yet broadcast</text>
    <text class="tiny" x="965" y="462" style="text-anchor:end">round principal amounts; fees omitted</text>
  </g>
</svg>
